name: Build archival pilot
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: blog-pilot-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'andrejverity/veritythink_blog' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    outputs:
      publish: ${{ steps.import.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the isolated pilot builder and importer
        run: |
          cp 1-build.py build.py
          source=$(find . -maxdepth 1 -name '*import_google.py' -print -quit)
          test -n "$source"
          if [ "$source" != './import_google.py' ]; then cp "$source" import_google.py; fi
      - name: Obtain a short-lived read-only Google token
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_READER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly,https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Read only the approved archival pilot
        id: import
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          BLOG_SOURCE_CONFIG: ${{ secrets.BLOG_SOURCE_CONFIG }}
        run: python3 import_google.py
      - name: Build and validate archival test
        if: steps.import.outputs.publish == 'true'
        run: |
          python3 build.py
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          p = Path('_site/build-manifest.json')
          manifest = json.loads(p.read_text())
          manifest.update(json.loads(Path('source-proof.json').read_text()))
          p.write_text(json.dumps(manifest, indent=2))
          PYTHON
      - name: Upload only the sanitized static site
        if: steps.import.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1
  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy isolated preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
