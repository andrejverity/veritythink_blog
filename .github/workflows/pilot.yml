name: Build blog preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blog-preview-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'andrejverity/veritythink_blog' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      publish: ${{ steps.import.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the builder and importer
        run: |
          cp 1-build.py build.py
          cp 1-import_google.py import_google.py
      - name: Obtain a short-lived read-only Google token
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_READER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly,https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Read the gated posts from private Google sources
        id: import
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          BLOG_SOURCE_CONFIG: ${{ secrets.BLOG_SOURCE_CONFIG }}
        run: python3 import_google.py
      - name: Build and validate the preview site
        if: steps.import.outputs.publish == 'true'
        run: |
          python3 build.py
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          p = Path('_site/build-manifest.json')
          manifest = json.loads(p.read_text())
          manifest.update(json.loads(Path('source-proof.json').read_text()))
          p.write_text(json.dumps(manifest, indent=2))
          PYTHON
      - name: Pass the approved public snapshots to the saving job
        if: steps.import.outputs.publish == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approved-blog-snapshot
          path: content/
          if-no-files-found: error
          retention-days: 1
      - name: Upload only the sanitized static site
        if: steps.import.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1
  save_snapshot:
    needs: build
    if: needs.build.outputs.publish == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Reject a stale publishing request
        env:
          REQUEST_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUEST_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: approved-blog-snapshot
          path: snapshot
      - name: Validate and sync the approved public snapshots
        run: |
          python3 - <<'PYTHON'
          import json, re, shutil
          from pathlib import Path
          root = Path('snapshot')
          files = [p for p in root.rglob('*') if p.is_file()]
          assert files, 'Empty publishing artifact'
          assert not any(p.is_symlink() for p in root.rglob('*'))
          folder_re = re.compile(r'^\d{4}-\d{2}-\d{2}-[a-z0-9][a-z0-9-]*$')
          img_re = re.compile(r'^image-\d+\.(png|jpg|gif)$')
          magic = {'png': b'\x89PNG\r\n\x1a\n', 'jpg': b'\xff\xd8\xff', 'gif': b'GIF8'}
          blocked = ['1ylsr0porjld59j9xg1jbzecnu1s0klyl', '11qcbcyin-3glyu2gytxgij54kprhydum', 'data:image', '<script', '<iframe', '<form']
          by_folder = {}
          for p in files:
              rel = 'content/' + p.relative_to(root).as_posix()
              assert rel.startswith('content/'), 'Unexpected artifact path: ' + rel
              if rel == 'content/site.json':
                  cfg = json.loads(p.read_text())
                  assert isinstance(cfg, dict)
                  for k, v in cfg.items():
                      assert isinstance(v, str) and not any(b in v.lower() for b in blocked), 'Unsafe site config: ' + k
                      if k.startswith('nav_') and k.endswith('_url'):
                          assert v.startswith('https://') and 'google' not in v, 'Unsafe nav URL: ' + k
                  continue
              parts = rel.split('/')
              assert len(parts) >= 3 and parts[1] == 'posts', 'Unexpected artifact path: ' + rel
              folder = parts[2]
              assert folder_re.fullmatch(folder), 'Unexpected post folder: ' + folder
              by_folder.setdefault(folder, set()).add('/'.join(parts[3:]))
          assert by_folder, 'No post snapshots in artifact'
          for folder, rels in sorted(by_folder.items()):
              assert 'post.json' in rels, 'Missing post.json: ' + folder
              post = json.loads((root/'posts'/folder/'post.json').read_text())
              assert set(post) == {'id','slug','title','date','display_date','timestamp_utc','original_url','kind','html','images'}, folder
              assert post['kind'] in {'archive', 'new-test'}, folder
              assert post['date'] + '-' + post['slug'] == folder, folder + ': folder must stay date-first and match slug'
              if post['original_url'] is not None:
                  assert post['original_url'].startswith('https://blog.veritythink.com/post/'), folder
              low = post['html'].lower()
              for b in blocked:
                  assert b not in low, folder + ': blocked content ' + b
              assert len(post['html']) < 1_000_000, folder + ': article too large'
              assert post['html'].count('<img ') == len(post['images']), folder + ': image count'
              expected = {'images/' + n for n in post['images']}
              assert set(rels) == {'post.json'} | expected, folder + ': file list mismatch'
              for n in post['images']:
                  assert img_re.fullmatch(n), folder + ': bad image name ' + n
                  data = (root/'posts'/folder/'images'/n).read_bytes()
                  ext = n.rsplit('.', 1)[-1]
                  assert data.startswith(magic[ext]) and len(data) < 8_000_000, folder + ': bad image ' + n
          dest = Path('content')
          if dest.exists():
              shutil.rmtree(dest)
          shutil.copytree(root, dest)
          print('Validated ' + str(len(by_folder)) + ' post snapshot(s).')
          PYTHON
      - name: Save approved snapshots without a recursive workflow run
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- content/
          git rm --ignore-unmatch -- 2-ring.json 3-ring-1.png 4-ring-2.png
          git rm -r --ignore-unmatch -- content/posts/64003052404-the-humanitarian-ring
          if git diff --cached --quiet; then
            echo 'Approved snapshot is already current.'
          else
            git commit -m 'Save approved blog publishing snapshot'
            git push origin HEAD:main
          fi
  deploy:
    needs: [build, save_snapshot]
    if: always() && !cancelled() && needs.build.result == 'success' && needs.build.outputs.publish == 'true' && (needs.save_snapshot.result == 'success' || needs.save_snapshot.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
