name: Build archival pilot
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
permissions:
  contents: read
concurrency:
  group: blog-pilot-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'andrejverity/veritythink_blog' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    outputs:
      publish: ${{ steps.import.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the isolated pilot builder and importer
        run: |
          cp 1-build.py build.py
          cp 1-import_google.py import_google.py
      - name: Obtain a short-lived read-only Google token
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_READER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly,https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Read only the approved archival pilot
        id: import
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          BLOG_SOURCE_CONFIG: ${{ secrets.BLOG_SOURCE_CONFIG }}
        run: python3 import_google.py
      - name: Build and validate archival test
        if: steps.import.outputs.publish == 'true'
        run: |
          python3 build.py
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          p = Path('_site/build-manifest.json')
          manifest = json.loads(p.read_text())
          manifest.update(json.loads(Path('source-proof.json').read_text()))
          p.write_text(json.dumps(manifest, indent=2))
          PYTHON
      - name: Pass only the approved public Ring snapshot to the saving job
        if: steps.import.outputs.publish == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approved-ring-snapshot
          path: content/posts/
          if-no-files-found: error
          retention-days: 1
      - name: Upload only the sanitized static site
        if: steps.import.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1
  save_snapshot:
    needs: build
    if: needs.build.outputs.publish == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Reject a stale publishing request
        env:
          REQUEST_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUEST_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: approved-ring-snapshot
          path: snapshot
      - name: Validate and copy only Ring's approved files
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, shutil
          from pathlib import Path
          name = '64003052404-the-humanitarian-ring'
          root = Path('snapshot')
          expected = {name + '/post.json', name + '/images/ring-1.png', name + '/images/ring-2.png'}
          assert not any(p.is_symlink() for p in root.rglob('*'))
          assert {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()} == expected
          post = json.loads((root/name/'post.json').read_text())
          assert set(post) == {'id','slug','title','date','original_url','kind','html','images'}
          assert post['id'] == '64003052404' and post['slug'] == 'the-humanitarian-ring'
          assert post['title'] == 'The Humanitarian Ring' and post['date'] == '2013-10-14'
          assert post['original_url'] == 'https://blog.veritythink.com/post/64003052404/the-humanitarian-ring'
          assert post['kind'] == 'legacy-test' and post['images'] == ['ring-1.png','ring-2.png']
          assert post['html'].count('<img ') == 2 and len(post['html']) < 1000000
          for blocked in ['docs.google.com','drive.google.com','googleusercontent.com','data:image','<script','<iframe','<form']:
              assert blocked not in post['html'].lower()
          target = Path('content/posts')/name
          target.mkdir(parents=True, exist_ok=True)
          for rel in sorted(expected):
              source = root/rel
              assert source.stat().st_size < 5000000
              if source.suffix == '.png':
                  assert source.read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
              dest = Path('content/posts')/rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, dest)
          PYTHON
      - name: Save approved snapshot without a recursive workflow run
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- content/posts/64003052404-the-humanitarian-ring/post.json content/posts/64003052404-the-humanitarian-ring/images/ring-1.png content/posts/64003052404-the-humanitarian-ring/images/ring-2.png
          git rm --ignore-unmatch -- 2-ring.json 3-ring-1.png 4-ring-2.png
          if git diff --cached --quiet; then
            echo 'Approved Ring snapshot is already current.'
          else
            git commit -m 'Save approved Ring publishing snapshot'
            git push origin HEAD:main
          fi
  deploy:
    needs: [build, save_snapshot]
    if: always() && !cancelled() && needs.build.result == 'success' && needs.build.outputs.publish == 'true' && (needs.save_snapshot.result == 'success' || needs.save_snapshot.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy isolated preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
