name: Temporary timer diagnostic

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  timer-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record event and UTC time only
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          printf 'event=%s\n' "$EVENT_NAME"
          date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
